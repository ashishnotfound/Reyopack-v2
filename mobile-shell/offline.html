<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07150f" />
    <title>Reyo Pack · Offline</title>
  </head>
  <body style="margin:0;background:#07150f;color:#f4fff8;font-family:system-ui,sans-serif">
    <main style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center">
      <div>
        <h1 style="margin:0 0 12px">Connection needed</h1>
        <p style="max-width:320px;color:#a9b9af">Reconnect to the internet, then reopen Reyo Pack or try again.</p>
        <button onclick="location.reload()" style="min-height:48px;border:0;border-radius:10px;padding:0 24px;background:#31d578;color:#07150f;font-weight:800">Try again</button>
      </div>
    </main>
  </body>
</html>
